[project]
name = "driftwatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "mlflow>=3.1.4",
    "pandas>=2.3.3",
    "pydantic>=2.13.5",
    "pytest>=8.4.2",
    "scikit-learn>=1.6.1",
    "uvicorn>=0.39.0",
]

[project.scripts]
driftwatch = "driftwatch:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
